#   - install `cross` (taiki-e/install-action@v2 with tool: cross)
#   - cross build --release --target <triple> -p mx-cli -p mx-mcp-server
#   - scripts/package.sh <triple> "$VERSION" target/<triple>/release
#   - upload to RELEASES_REPO via the same gh release flow
#
# TODO (Homebrew tap): after macos job finishes, open a PR to TAP_REPO that
#   updates Formula/mx.rb with the new version + sha256. Either hand-roll a
#   workflow or use mislav/bump-homebrew-formula-action@v3.
#
# TODO (publish flow): once Linux is added, create the GH release as a draft,
