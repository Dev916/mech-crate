name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, e.g. 0.1.1 (no leading v)'
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RELEASES_REPO: unyform-ai/mech-crate-releases
  # TAP_REPO is where the tap-bump job opens the Formula/mechcrate.rb PR.
  TAP_REPO: unyform-ai/homebrew-tap
  APPLE_TEAM_ID: T6L7MKBUHZ
  APPLE_SIGNING_IDENTITY: "Developer ID Application: PRICELOVE, LLC (T6L7MKBUHZ)"

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.set.outputs.version }}
      tag: ${{ steps.set.outputs.tag }}
    steps:
      - id: set
        # Untrusted/external inputs are read via env, never interpolated
        # directly into the run script (workflow-injection mitigation).
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "push" ]]; then
            tag="${GITHUB_REF#refs/tags/}"
            version="${tag#v}"
          else
            version="$INPUT_VERSION"
            tag="v${version}"
          fi
          # Constrain to expected shape: digits.dots, optional pre-release suffix.
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "error: invalid version '$version'" >&2
            exit 1
          fi
          echo "tag=$tag"         >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # The binary reports Cargo.toml's version, and mx self-update refuses a
      # bundle whose VERSION file and binary disagree — so a tag that does not
      # match the crate version would ship an uninstallable release. Fail here.
      - uses: actions/checkout@v4
      - name: The release version must match the crate version
        env:
          VERSION: ${{ steps.set.outputs.version }}
        run: |
          set -euo pipefail
          crate="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          if [[ "$crate" != "$VERSION" ]]; then
            echo "::error::Cargo.toml [workspace.package] version is '$crate' but this release is '$VERSION'; bump Cargo.toml (and Cargo.lock) first"
            exit 1
          fi

  # The release gate. Mirrors ci.yml's lint + test + coverage jobs (the
  # known-broken scoreboard lane is deliberately excluded — it is expected-red
  # and non-blocking, so it has no business in a release decision).
  #
  # Every build/publish job below MUST list this job in `needs:` so a tag can
  # never ship binaries from a commit whose suite is red.
  test:
    name: test gate (fmt + clippy + nextest + coverage)
    needs: resolve-version
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      pgvector:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: mx_rag
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MX_RAG_TEST_DATABASE_URL: postgres://postgres@localhost:55433/mx_rag
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-test-gate
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-llvm-cov
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: make test
      - run: make coverage

  # One draft release per tag, created only when the cross-repo token exists.
  # Every platform job uploads into the draft; `publish` flips it live once
  # ALL of them succeed, so `releases/latest` (what mx self-update trusts)
  # can never point at a release that is missing a platform. If a platform
  # job fails the draft stays a draft and the run is red — do not "fix" a
  # stuck draft by publishing it by hand without every asset.
  create-draft:
    name: create draft release
    needs: [resolve-version, test]
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.gate.outputs.publish }}
    env:
      VERSION: ${{ needs.resolve-version.outputs.version }}
      TAG: ${{ needs.resolve-version.outputs.tag }}
    steps:
      - id: gate
        env:
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::warning::RELEASES_REPO_TOKEN absent: tarballs are kept as run artifacts, nothing is published to $RELEASES_REPO"
            exit 0
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
          # Publishing a release creates its tag, and a tag needs a commit to
          # point at: on an empty releases repo the draft is created fine and
          # `publish` then fails with "HTTP 422 ... Repository is empty" after
          # every platform has built (v0.1.2, 2026-09-17). Fail here instead.
          if [[ "$(gh api "repos/${RELEASES_REPO}/commits?per_page=1" --jq 'length')" == "0" ]]; then
            echo "::error::${RELEASES_REPO} has no commits; a release cannot be published on an empty repo. Push a README there first."
            exit 1
          fi
          # A pre-release suffix (0.1.2-rc.1) marks the GitHub release as a
          # prerelease so releases/latest never returns it.
          prerelease=()
          if [[ "$VERSION" == *-* ]]; then
            prerelease=(--prerelease)
          fi
          # Idempotent: reuse an existing (draft) release for this tag.
          if ! gh release view "$TAG" --repo "$RELEASES_REPO" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "$RELEASES_REPO" \
              --draft \
              --title "$TAG" \
              --notes "Automated release for $TAG." \
              "${prerelease[@]}"
          fi

  macos:
    needs: [resolve-version, test, create-draft]
    runs-on: macos-14
    env:
      VERSION: ${{ needs.resolve-version.outputs.version }}
      TAG: ${{ needs.resolve-version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain + macOS targets
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos-release

      - name: Build (aarch64-apple-darwin)
        run: cargo build --release --target aarch64-apple-darwin -p mx-cli -p mx-mcp-server

      - name: Build (x86_64-apple-darwin)
        run: cargo build --release --target x86_64-apple-darwin -p mx-cli -p mx-mcp-server

      - name: Lipo into universal binaries
        run: |
          set -euo pipefail
          mkdir -p target/universal-apple-darwin/release
          for bin in mx mx-mcp; do
            lipo -create -output "target/universal-apple-darwin/release/$bin" \
              "target/aarch64-apple-darwin/release/$bin" \
              "target/x86_64-apple-darwin/release/$bin"
            file "target/universal-apple-darwin/release/$bin"
          done

      # Signing is conditional on the Developer ID material being present as
      # secrets. Without it the binaries are ad-hoc signed (`codesign -s -`):
      # that passes `codesign --verify --strict` (what `mx self-update`
      # checks) but is NOT notarized, so Gatekeeper refuses a *quarantined*
      # copy — i.e. one downloaded by a browser. `mx self-update` and the
      # curl installer write files without the quarantine xattr, so those
      # paths run either way. Adding the APPLE_* secrets switches to
      # Developer ID + notarization with no workflow change.
      - name: Detect signing material
        id: signing
        env:
          P12: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          API_KEY: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -n "$P12" && -n "$API_KEY" ]]; then
            echo "developer-id=true" >> "$GITHUB_OUTPUT"
          else
            echo "developer-id=false" >> "$GITHUB_OUTPUT"
            echo "::warning::APPLE_* secrets absent: binaries will be ad-hoc signed and not notarized"
          fi

      - name: Import Developer ID Application certificate
        if: steps.signing.outputs.developer-id == 'true'
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          p12-password: ${{ secrets.APPLE_CERT_PASSWORD }}

      - name: Codesign binaries (Developer ID)
        if: steps.signing.outputs.developer-id == 'true'
        run: |
          set -euo pipefail
          for bin in mx mx-mcp; do
            codesign --force --options runtime --timestamp \
              --sign "$APPLE_SIGNING_IDENTITY" \
              "target/universal-apple-darwin/release/$bin"
            codesign --verify --strict --verbose=2 \
              "target/universal-apple-darwin/release/$bin"
          done

      - name: Codesign binaries (ad-hoc fallback)
        if: steps.signing.outputs.developer-id != 'true'
        run: |
          set -euo pipefail
          for bin in mx mx-mcp; do
            codesign --force --sign - "target/universal-apple-darwin/release/$bin"
            codesign --verify --strict --verbose=2 \
              "target/universal-apple-darwin/release/$bin"
          done

      - name: Notarize
        if: steps.signing.outputs.developer-id == 'true'
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          mkdir -p notarize
          # App Store Connect API key for notarytool (no Apple ID password).
          echo "$APPLE_API_KEY_BASE64" | base64 --decode > notarize/AuthKey.p8

          # Bare Mach-O binaries can't be stapled, so we submit a zip and let
          # the notarization ticket attach server-side. Gatekeeper verifies the
          # ticket online when the file has the quarantine xattr.
          ditto -c -k --keepParent target/universal-apple-darwin/release notarize/binaries.zip

          xcrun notarytool submit notarize/binaries.zip \
            --key notarize/AuthKey.p8 \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --wait

          rm -f notarize/AuthKey.p8

      - name: Package tarball
        run: |
          set -euo pipefail
          scripts/package.sh \
            universal-apple-darwin \
            "$VERSION" \
            target/universal-apple-darwin/release

      - name: Upload artifact (kept on the Actions run for debugging)
        uses: actions/upload-artifact@v4
        with:
          name: mx-universal-apple-darwin
          path: |
            dist/mx-v*-universal-apple-darwin.tar.gz
            dist/mx-v*-universal-apple-darwin.tar.gz.sha256
          if-no-files-found: error

      - name: Upload to the draft release
        if: needs.create-draft.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
        run: |
          set -euo pipefail
          asset="dist/mx-v${VERSION}-universal-apple-darwin.tar.gz"
          gh release upload "$TAG" "$asset" "${asset}.sha256" \
            --repo "$RELEASES_REPO" --clobber

  linux:
    needs: [resolve-version, test, create-draft]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        triple: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    env:
      VERSION: ${{ needs.resolve-version.outputs.version }}
      TAG: ${{ needs.resolve-version.outputs.tag }}
      TRIPLE: ${{ matrix.triple }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-${{ matrix.triple }}
      # cross builds inside a musl container; the result is a static binary
      # (reqwest is on rustls, sqlx on rustls, so there is no OpenSSL to link).
      - uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build (${{ matrix.triple }})
        run: cross build --release --target "$TRIPLE" -p mx-cli -p mx-mcp-server

      # x86_64-musl links static-pie ("static-pie linked"), aarch64-musl
      # links non-PIE ("statically linked"); both are fully static.
      - name: Prove the binaries are static
        run: |
          set -euo pipefail
          for bin in mx mx-mcp; do
            file "target/$TRIPLE/release/$bin" | tee /dev/stderr \
              | grep -Eq "statically linked|static-pie linked"
          done

      - name: Package tarball
        run: scripts/package.sh "$TRIPLE" "$VERSION" "target/$TRIPLE/release"

      - name: Upload artifact (kept on the Actions run for debugging)
        uses: actions/upload-artifact@v4
        with:
          name: mx-${{ matrix.triple }}
          path: |
            dist/mx-v*-${{ matrix.triple }}.tar.gz
            dist/mx-v*-${{ matrix.triple }}.tar.gz.sha256
          if-no-files-found: error

      - name: Upload to the draft release
        if: needs.create-draft.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
        run: |
          set -euo pipefail
          asset="dist/mx-v${VERSION}-${TRIPLE}.tar.gz"
          gh release upload "$TAG" "$asset" "${asset}.sha256" \
            --repo "$RELEASES_REPO" --clobber

  # Flips the draft live. `needs` on every platform job is the invariant:
  # this never runs unless all of them uploaded.
  publish:
    name: publish release
    needs: [resolve-version, create-draft, macos, linux]
    if: needs.create-draft.outputs.publish == 'true'
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.resolve-version.outputs.tag }}
    steps:
      - env:
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
        run: |
          set -euo pipefail
          gh release edit "$TAG" --repo "$RELEASES_REPO" --draft=false
          gh release view "$TAG" --repo "$RELEASES_REPO" \
            --json tagName,isDraft,isPrerelease,assets \
            --jq '{tagName, isDraft, isPrerelease, assets: [.assets[].name]}'

  # Opens the version-bump PR on the Homebrew tap once the release is live.
  # Stable releases only: a prerelease never reaches releases/latest, so the
  # tap must not point at one either. The formula is regenerated in full by
  # scripts/homebrew/render-formula.sh because it carries three url/sha256
  # pairs and mislav/bump-homebrew-formula-action rewrites only the first.
  # `needs: publish` keeps it behind the release gate (publish needs every
  # platform, which needs test).
  tap-bump:
    name: bump Homebrew tap
    needs: [resolve-version, publish]
    if: ${{ !contains(needs.resolve-version.outputs.version, '-') }}
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.resolve-version.outputs.version }}
      TAG: ${{ needs.resolve-version.outputs.tag }}
      GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Render Formula/mechcrate.rb from the release checksums
        run: scripts/homebrew/render-formula.sh "$VERSION" > "$RUNNER_TEMP/mechcrate.rb"

      - name: Open the bump PR on the tap
        run: |
          set -euo pipefail
          branch="mechcrate-${VERSION}"
          gh auth setup-git
          git clone --depth 1 "https://github.com/${TAP_REPO}.git" tap
          cd tap
          git config user.name "mech-crate-release"
          git config user.email "release@mechcrate.dev"
          git checkout -b "$branch"
          mkdir -p Formula
          cp "$RUNNER_TEMP/mechcrate.rb" Formula/mechcrate.rb
          git add Formula/mechcrate.rb
          if git diff --cached --quiet; then
            echo "Formula/mechcrate.rb already at ${VERSION}; nothing to bump"
            exit 0
          fi
          git commit -m "mechcrate ${VERSION}"
          git push --force origin "$branch"
          if gh pr view "$branch" --repo "$TAP_REPO" >/dev/null 2>&1; then
            echo "bump PR for $branch is already open"
          else
            gh pr create --repo "$TAP_REPO" --base main --head "$branch" \
              --title "mechcrate ${VERSION}" \
              --body "Automated bump to [${TAG}](https://github.com/${RELEASES_REPO}/releases/tag/${TAG}), rendered by scripts/homebrew/render-formula.sh from the release checksum sidecars."
          fi

# ─────────────────────────────────────────────────────────────────────────────
# NOTE: every job added above must keep `test` in its `needs:` (directly, or
# transitively through `create-draft`) — that is the release gate.
#
