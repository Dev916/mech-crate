[workspace]
resolver = "2"
members = [
    "crates/mx-lib",
    "crates/mx-cli",
    "crates/mx-mcp-server",
]

[workspace.package]
version = "0.1.1"
edition = "2021"
authors = ["MechCrate Team"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/Dev916/mech-crate"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.44", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async traits
async-trait = "0.1"

# HTTP client
reqwest = { version = "0.12", features = ["json"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Process execution
which = "7.0"

# UUID
uuid = { version = "1.11", features = ["v4"] }

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Glob patterns
glob = "0.3"

# Directory walking
walkdir = "2.5"

# Environment variables
dotenvy = "0.15"

# CLI argument parsing
clap = { version = "4.5", features = ["derive", "env"] }

# CLI-specific
dialoguer = "0.11"
indicatif = "0.17"
console = "0.15"

# Template engine
tera = "1.19"

# Home directory
dirs = "5.0"

# Regex
regex = "1.10"

# HTTP mocking for tests
wiremock = "0.6"

# Test harness
proptest = "1"
assert_cmd = "2.0"
predicates = "3.0"
tempfile = "3.10"

# Database (pgvector corpus)
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "migrate"] }
pgvector = { version = "=0.4.1", features = ["sqlx"] }

# YAML frontmatter
serde_yaml = "0.9"

# TOML config
toml = "0.8"

# Tarball extraction (self-update)
flate2 = "1"
tar = "0.4"

# Semver (self-update version compare)
semver = "1"

# Hashing
sha2 = "0.10"
hex = "0.4"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
