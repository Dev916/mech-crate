# ========================================
# site - Development Docker Compose Override
# ========================================
# Traefik routes to this service via devmesh-traefik network (no direct port exposure needed)

services:
  # ------------------------------------------
  # Astro SSR Application (Development)
  # ------------------------------------------
  site:
    build:
      target: development
    container_name: site-dev
    environment:
      - NODE_ENV=development
      - PORT=4321
      - APP_URL=http://mechcrate.localhost
      # The corpus loader reads the repo's docs/ from outside apps/site; see the
      # /repo mount below and src/content.config.ts.
      - MECHCRATE_REPO_ROOT=/repo
    # Mount source code for hot reload
    volumes:
      - ../../apps/site:/app
      - /app/node_modules
      - /app/.astro
      # Techniques corpus source, read-only. Without this the container renders
      # the authored pages only and `corpus: published 0 docs`.
      - ../../../docs:/repo/docs:ro
    ports:
      - "24678:24678"  # Vite HMR
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4321/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
# No db/redis overrides: this site is a static docs build with no datastores.
# See docker/compose/site.yml for the deviation note.
