# ─────────────────────────────────────────────────────────────────────────────
# {{SERVICE_NAME}} - Development Docker Compose Override
# Live reload with zola serve
# ─────────────────────────────────────────────────────────────────────────────
# Traefik routes to this service via devmesh-traefik network (no direct port exposure needed)

services:
  # ───────────────────────────────────────────────────────────────────────────
  # Zola Static Site (Development)
  # ───────────────────────────────────────────────────────────────────────────
  {{SERVICE_NAME}}:
    build:
      target: development
      args:
        - ZOLA_VERSION=${ZOLA_VERSION:-{{ZOLA_VERSION}}}
    environment:
      - APP_ENV=development
      - ZOLA_PORT={{PORT}}
      - ZOLA_BASE_URL=localhost
    # Mount source code for live reload
    volumes:
      - ../../apps/{{SERVICE_NAME}}:/site:cached
      # Exclude public directory (generated output)
      - /site/public
    ports:
      # Live reload WebSocket. `zola serve` has no flag for this port, so the
      # container side stays 1024 and only the host side moves: a second stack
      # that sets ZOLA_LIVERELOAD_PORT boots with live reload degraded rather
      # than not booting at all.
      - "${ZOLA_LIVERELOAD_PORT:-1024}:1024"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:{{PORT}}"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # Override labels for development (Zola serves on a different port). Compose
    # merges `labels:` by KEY, so these names must match service.yml's exactly,
    # project prefix included: a name that drifted would ADD a second router
    # rather than override the first.
    labels:
      - traefik.enable=true
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}-{{SERVICE_SLUG}}.rule=Host(`${{{SERVICE_UPPER}}_ROUTER_HOST:-{{DOMAIN}}}`)
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}-{{SERVICE_SLUG}}.entrypoints=web
      - traefik.http.services.${COMPOSE_PROJECT_NAME}-{{SERVICE_SLUG}}.loadbalancer.server.port={{PORT}}
      - traefik.docker.network=devmesh-traefik
