# {{SERVICE_NAME}} - Rust Leptos SSR Stack (Development Overrides)
# Generated by MechCrate Rust-Leptos Recipe
# Traefik routes to this service via devmesh-traefik network (no direct port exposure needed)

services:
  {{SERVICE_NAME}}:
    build:
      target: development
    volumes:
      - ../../apps/{{SERVICE_NAME}}:/app
      - {{SERVICE_NAME}}_cargo_cache:/usr/local/cargo/registry
      - {{SERVICE_NAME}}_target_cache:/app/target
    # No DATABASE_URL here on purpose (bd:mech-crate-q1w): a hardcoded
    # `{{SERVICE_SLUG}}:secret` that outranked every `env_file` layer, so it beat
    # the credentials generate-secrets.sh generates per project. The resolved
    # literal lives in `.env.{{SERVICE_NAME}}` and serves dev and non-dev alike.
    environment:
      - RUST_LOG=debug,{{SERVICE_SLUG}}=debug
      - REDIS_URL=redis://redis:6379
      - LEPTOS_SITE_ADDR=0.0.0.0:3000
      # cargo-leptos injects this port into the page it serves, so the host and
      # container sides have to agree. LEPTOS_RELOAD_HOST_PORT drives both, which
      # is what lets a second stack move the whole reload channel and keep it
      # working. (A distinct name on purpose: interpolating LEPTOS_RELOAD_PORT
      # itself here would collide with the env_file layer that also carries it,
      # which bd:mech-crate-q1w forbids.)
      - LEPTOS_RELOAD_PORT=${LEPTOS_RELOAD_HOST_PORT:-3001}
    ports:
      - "${LEPTOS_RELOAD_HOST_PORT:-3001}:${LEPTOS_RELOAD_HOST_PORT:-3001}"
    healthcheck:
      disable: true

  db:
    ports:
      # Ephemeral: see docker/compose/db.dev.yml for the discovery command.
      - "${DB_HOST_PORT:-0}:5432"

  redis:
    ports:
      # Ephemeral: see docker/compose/redis.dev.yml for the discovery command.
      - "${REDIS_HOST_PORT:-0}:6379"

volumes:
  {{SERVICE_NAME}}_cargo_cache:
  {{SERVICE_NAME}}_target_cache:
