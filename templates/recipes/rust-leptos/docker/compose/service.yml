# {{SERVICE_NAME}} - Rust Leptos SSR Stack (Production)
# Generated by MechCrate Rust-Leptos Recipe
# Traefik routes to this service via devmesh-traefik network

include:
  - ./redis.yml
  - ./db.yml

services:
  {{SERVICE_NAME}}:
    build:
      context: ../..
      dockerfile: docker/dockerfiles/{{SERVICE_NAME}}/app
      target: production
    restart: unless-stopped
    env_file:
      - ../.config/.env.shared
      - ../.config/.env.secrets
      - ../.config/.env.{{SERVICE_NAME}}
    # No DATABASE_URL here on purpose (bd:mech-crate-q1w). It said
    # `postgres://{{SERVICE_SLUG}}:${DB_PASSWORD}@db:5432/{{SERVICE_SLUG}}`, and
    # the compose CLI interpolates `${…}` from the compose project directory's
    # `.env` only — never from an `env_file` layer — so on every non-dev path the
    # password rendered empty with a `variable is not set` warning. An
    # `environment:` block outranks every `env_file` layer, so that empty result
    # replaced the literal generate-secrets.sh had resolved into
    # `.env.{{SERVICE_NAME}}`, which is where it belongs.
    environment:
      - RUST_LOG=info,{{SERVICE_SLUG}}=info
      - REDIS_URL=redis://redis:6379
      - LEPTOS_SITE_ADDR=0.0.0.0:3000
      - LEPTOS_SITE_ROOT=site
    networks:
      - default
      - devmesh-traefik
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      # Traefik keeps ONE router/service table per provider for the whole
      # machine, so these names carry the compose project (bd:mech-crate-298);
      # the compose CLI supplies COMPOSE_PROJECT_NAME from the project name it
      # resolved. The hostname keeps its default; a second stack that scaffolded
      # the same service name moves with
      # `{{SERVICE_UPPER}}_ROUTER_HOST=other.localhost make dev`.
      - traefik.enable=true
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}-{{SERVICE_NAME}}.rule=Host(`${{{SERVICE_UPPER}}_ROUTER_HOST:-{{DOMAIN}}}`)
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}-{{SERVICE_NAME}}.entrypoints=web
      - traefik.http.services.${COMPOSE_PROJECT_NAME}-{{SERVICE_NAME}}.loadbalancer.server.port=3000
      - traefik.docker.network=devmesh-traefik

networks:
  devmesh-traefik:
    external: true
