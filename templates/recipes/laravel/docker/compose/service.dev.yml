# {{SERVICE_NAME}} - Laravel Octane + Swoole Stack (Development Overrides)
# Generated by MechCrate Laravel Recipe
# Traefik routes to this service via devmesh-traefik network (no direct port exposure needed)

services:
  {{SERVICE_NAME}}:
    build:
      target: development
    volumes:
      - ../../apps/{{SERVICE_NAME}}:/app
      - /app/vendor
      - /app/node_modules
    environment:
      - APP_MODE=app
      - APP_ENV=local
      - APP_DEBUG=true
      - OCTANE_SERVER=swoole
    ports:
      # Both ephemeral: the browser never dials either. The recipe's own nginx
      # proxies /build/ and /__vite_hmr to 127.0.0.1:5173 same-origin, and PHP
      # reaches Inertia SSR at 127.0.0.1:13714 inside the container. These
      # publishes are for inspecting the two processes directly:
      #   docker compose -p "$COMPOSE_PROJECT_NAME" port {{SERVICE_NAME}} 5173
      - "${VITE_HOST_PORT:-0}:5173"
      - "${INERTIA_SSR_HOST_PORT:-0}:13714"

