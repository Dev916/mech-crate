# {{SERVICE_NAME}} - Laravel Octane + Swoole Stack (Production)
# Generated by MechCrate Laravel Recipe

include:
  - ./db.yml
  - ./redis.yml
  - ./{{SERVICE_NAME}}.worker.yml
  - ./{{SERVICE_NAME}}.scheduler.yml

services:
  # ─────────────────────────────────────────────────────────────────────────────
  # Laravel Octane Application (Swoole + Nginx + Supervisor)
  # ─────────────────────────────────────────────────────────────────────────────
  {{SERVICE_NAME}}:
    build:
      context: ../..
      dockerfile: docker/dockerfiles/{{SERVICE_NAME}}/app
      target: production
    env_file:
      - ../.config/.env.shared
      - ../.config/.env.secrets
      - ../.config/.env.{{SERVICE_NAME}}
    environment:
      - APP_MODE=app
      - APP_ENV=production
      - OCTANE_WORKERS=auto
      - OCTANE_TASK_WORKERS=auto
      - INERTIA_SSR_ENABLED=true
    volumes:
      - ../../apps/{{SERVICE_NAME}}/storage:/app/storage
    networks:
      - default
      - devmesh-traefik
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      {{SERVICE_NAME}}-worker:
        condition: service_healthy
      {{SERVICE_NAME}}-scheduler:
        condition: service_healthy
    labels:
      # Traefik keeps ONE router/service table per provider for the whole
      # machine, so these names carry the compose project (bd:mech-crate-298);
      # the compose CLI supplies COMPOSE_PROJECT_NAME from the project name it
      # resolved. The hostname keeps its default; a second stack that scaffolded
      # the same service name moves with
      # `{{SERVICE_UPPER}}_ROUTER_HOST=other.localhost make dev`.
      - traefik.enable=true
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}-{{SERVICE_NAME}}.rule=Host(`${{{SERVICE_UPPER}}_ROUTER_HOST:-{{DOMAIN}}}`)
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}-{{SERVICE_NAME}}.entrypoints=web
      - traefik.http.services.${COMPOSE_PROJECT_NAME}-{{SERVICE_NAME}}.loadbalancer.server.port=80
      - traefik.docker.network=devmesh-traefik
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/up"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s

networks:
  devmesh-traefik:
    external: true