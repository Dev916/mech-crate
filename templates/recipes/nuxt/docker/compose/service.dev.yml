# {{SERVICE_NAME}} - Nuxt Application (Development)
# Overrides for local development
# Traefik routes to this service via devmesh-traefik network (no direct port exposure needed)

services:
  {{SERVICE_NAME}}:
    build:
      target: development
    environment:
      - NODE_ENV=development
    # No ports here on purpose (bd:mech-crate-1a0). This used to publish
    # 24678:24678 for the HMR websocket, but Nuxt 4 serves HMR through Nitro on
    # the app's own port: a live dev container listens on 3000 and nothing else,
    # and the router upgrades `/_nuxt/` to a `vite-hmr` websocket same-origin
    # (verified: HTTP 101 through mx-router). The publish reserved a number for
    # no listener, and cost the next stack on the machine its own.
    volumes:
      # Mount source for hot-reload
      - ../../apps/{{SERVICE_NAME}}:/app:cached
      # Preserve node_modules for performance
      - {{SERVICE_NAME}}_node_modules:/app/node_modules
      # Nuxt build cache
      - {{SERVICE_NAME}}_nuxt:/app/.nuxt
    restart: "no"
    healthcheck:
      disable: true

volumes:
  {{SERVICE_NAME}}_node_modules:
  {{SERVICE_NAME}}_nuxt:
