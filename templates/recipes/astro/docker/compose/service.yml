# ========================================
# {{SERVICE_NAME}} - Production Docker Compose
# ========================================
# Traefik routes to this service via devmesh-traefik network

# db + redis are part of this recipe's service set (see recipe.json `services`),
# so the recipe ships their compose files next to this one and includes them
# unconditionally — same shape as the rust-leptos / rust-api / laravel recipes.
#
# There is deliberately no `optional:` here: Compose's `include` long syntax
# accepts only path / project_directory / env_file, so an `optional: true` key is
# silently ignored and a missing sibling is a hard error, not a skip
# (bd:mech-crate-eic).
include:
  - ./db.yml
  - ./redis.yml

services:
  # ------------------------------------------
  # Astro SSR Application
  # ------------------------------------------
  {{SERVICE_NAME}}:
    build:
      context: ../../apps/{{SERVICE_NAME}}
      dockerfile: ../../docker/dockerfiles/{{SERVICE_NAME}}/app
      # Must name a stage in that Dockerfile. This said `runner`, which matches
      # none of base/deps/builder/development/production, so every non-dev path
      # (make up / build / release) failed to resolve the target while `make
      # dev`'s `development` override hid it (bd:mech-crate-47j).
      target: production
    restart: unless-stopped
    env_file:
      - ../.config/.env.shared
      - ../.config/.env.secrets
      - ../.config/.env.{{SERVICE_NAME}}
    environment:
      - NODE_ENV=production
      - PORT=4321
      - DATABASE_URL=postgres://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      - REDIS_URL=redis://redis:6379
      - APP_URL=https://{{DOMAIN}}
    networks:
      - default
      - devmesh-traefik
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4321/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    labels:
      - traefik.enable=true
      - traefik.http.routers.{{SERVICE_SLUG}}.rule=Host(`{{DOMAIN}}`)
      - traefik.http.routers.{{SERVICE_SLUG}}.entrypoints=web
      - traefik.http.services.{{SERVICE_SLUG}}.loadbalancer.server.port=4321
      - traefik.docker.network=devmesh-traefik

networks:
  devmesh-traefik:
    external: true
