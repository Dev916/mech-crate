# {{SERVICE_NAME}} - Rust Job Worker (Development Overrides)
# Generated by MechCrate Rust-Worker Recipe

services:
  {{SERVICE_NAME}}:
    build:
      target: development
    volumes:
      - ../../apps/{{SERVICE_NAME}}:/app
      - cargo-cache:/usr/local/cargo/registry
      - target-cache:/app/target
    # No DATABASE_URL here on purpose (bd:mech-crate-q1w): a hardcoded
    # `{{SERVICE_SLUG}}:secret` that outranked every `env_file` layer, so it beat
    # the credentials generate-secrets.sh generates per project. The resolved
    # literal lives in `.env.{{SERVICE_NAME}}` and serves dev and non-dev alike.
    environment:
      - RUST_LOG=debug,{{SERVICE_SLUG}}=debug
      - REDIS_URL=redis://redis:6379
      - WORKER_THREADS=2
      - BATCH_SIZE=10
      - METRICS_ENABLED=true
      - METRICS_PORT=9090
    ports:
      # Metrics, ephemeral: the container healthcheck uses localhost:9090 inside
      # the container, so only scrapers need the host side. Find it with
      #   docker compose -p "$COMPOSE_PROJECT_NAME" port {{SERVICE_NAME}} 9090
      - "${METRICS_HOST_PORT:-0}:9090"
    deploy:
      replicas: 1
    healthcheck:
      disable: true

volumes:
  cargo-cache:
  target-cache:
