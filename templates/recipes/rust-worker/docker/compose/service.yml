# {{SERVICE_NAME}} - Rust Job Worker (Production)
# Generated by MechCrate Rust-Worker Recipe

# db + redis are part of this recipe's service set (see recipe.json `services`)
# and this file `depends_on` both, so the recipe ships their compose files next to
# this one and includes them unconditionally — same shape as the rust-leptos /
# rust-api / laravel / astro recipes. Without the include, `depends_on` pointed at
# services no compose file defined and `make dev` failed with
# `service "{{SERVICE_NAME}}" depends on undefined service "db"`.
include:
  - ./db.yml
  - ./redis.yml

services:
  {{SERVICE_NAME}}:
    build:
      context: ../..
      dockerfile: docker/dockerfiles/{{SERVICE_NAME}}/app
      target: production
    restart: unless-stopped
    command: ["worker", "--workers={{WORKERS}}", "--batch-size={{BATCH_SIZE}}"]
    # This recipe is db-bearing (see recipe.json `services`), but shipped with no
    # env layering at all: the db container was initialized from `.env.secrets`
    # while the worker never read it, so DB_USER/DB_PASSWORD/DB_NAME never reached
    # the process. Documented layering, last one winning: shared → secrets → service.
    env_file:
      - ../.config/.env.shared
      - ../.config/.env.secrets
      - ../.config/.env.{{SERVICE_NAME}}
    # No DATABASE_URL here on purpose (bd:mech-crate-q1w). It said
    # `postgres://{{SERVICE_SLUG}}:${DB_PASSWORD:-secret}@db:5432/{{SERVICE_SLUG}}`,
    # which was wrong three ways: the compose CLI cannot read `${DB_PASSWORD}`
    # out of an `env_file` layer (it interpolates only from the compose project
    # directory's `.env`, which no mx scaffold has), so `:-secret` always won and
    # authenticated against nothing; the role and database are the generated
    # `DB_USER`/`DB_NAME`, not the service slug; and an `environment:` block
    # outranks every `env_file` layer, so this line overwrote the literal
    # generate-secrets.sh had resolved into `.env.{{SERVICE_NAME}}`.
    environment:
      - RUST_LOG=info,{{SERVICE_SLUG}}=info
      - REDIS_URL=redis://redis:6379
      - WORKER_THREADS={{WORKERS}}
      - BATCH_SIZE={{BATCH_SIZE}}
      - METRICS_ENABLED=true
      - METRICS_PORT=9090
      - CHANNEL=jobs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    # No `networks:` on purpose (bd:mech-crate-4n4). This service used to join
    # `internal`, declared `external: true` — a promise that something else
    # created it, which nothing in mx ever did. `docker compose config` renders
    # an external network without looking for it, so the defect only surfaced at
    # `make dev`: "network internal declared as external, but could not be
    # found". The worker has no HTTP ingress, so unlike the web recipes it needs
    # no `devmesh-traefik`; leaving networks unset puts it on compose's
    # per-project default network, which is exactly where the `db` and `redis`
    # siblings it `depends_on` already are.
    labels:
      - "prometheus.scrape=true"
      - "prometheus.port=9090"
      - "prometheus.path=/metrics"
