# Application service - Baseline (Production)
# This is the production configuration
# Use app.dev.yml for development overrides

services:
  app:
    build:
      context: ../..
      dockerfile: docker/dockerfiles/app/app
      target: production
    env_file:
      - ../.config/.env.shared
      - ../.config/.env.secrets
      - ../.config/.env.app
    # DATABASE_URL / REDIS_URL are deliberately absent (bd:mech-crate-q1w). They
    # were built here from `${DB_USER}` / `${DB_PASSWORD}` / `${REDIS_PASSWORD}`,
    # and the compose CLI interpolates `${…}` from the compose project
    # directory's `.env` — never from an `env_file` layer. No mx scaffold has
    # that `.env`, so both rendered empty with `variable is not set` warnings,
    # and because an `environment:` block outranks every `env_file` layer the
    # empty values then beat the real ones. Both now live in `.env.app`, where
    # scripts/generate-secrets.sh resolves them into literals.
    environment:
      NODE_ENV: production
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - default
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

networks:
  default:
    name: mech-network
    external: true
