# Nginx reverse proxy service

services:
  nginx:
    image: nginx:alpine
    ports:
      # Overridable: the mx router already owns 80/443 on most workstations.
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ../system/nginx/etc/nginx:/etc/nginx:ro
      - ../system/nginx/usr/share/nginx/html:/usr/share/nginx/html:ro
    depends_on:
      - app
    networks:
      - default
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 3s
      retries: 3

networks:
  default:
    name: mech-network
    external: true
