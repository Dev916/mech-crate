# Background worker service

services:
  worker:
    build:
      context: ../..
      dockerfile: docker/dockerfiles/app/app
      target: production
    command: npm run worker
    env_file:
      - ../.config/.env.shared
      - ../.config/.env.secrets
      - ../.config/.env.app
    # DATABASE_URL / REDIS_URL are deliberately absent (bd:mech-crate-q1w), the
    # same call as app.yml: an `environment:` block outranks every `env_file`
    # layer, and the compose CLI cannot read `${DB_*}` / `${REDIS_*}` out of one,
    # so building the URLs here rendered them empty and overwrote the working
    # literals. Both now come from `.env.app`, resolved by
    # scripts/generate-secrets.sh.
    environment:
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - default
    restart: unless-stopped

networks:
  default:
    name: mech-network
    external: true
